name: Déployer la version web (GitHub Pages)

on:
  push:
    branches: [main, claude/cool-keller-w3lcz4]
  workflow_dispatch:
  # Republie toutes les heures en journée (heure UTC) pour rafraîchir les aperçus des webcams ;
  # les relevés Météo-France, publiés vers 06h30 UTC, sont repris au passage.
  schedule:
    - cron: '17 5-19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo export --platform web --output-dir dist
      - name: Relevés de neige Météo-France
        run: node scripts/fetch-snow-reports.mjs dist/snow-reports.json
      - name: Dernières images des webcams Skaping
        run: node scripts/fetch-webcams.mjs dist/webcams.json
      # Routage côté client : GitHub Pages sert 404.html pour les URLs inconnues
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
